name: Verify and normalize first release metadata
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-metadata.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs');
            const path=require('node:path');
            const crypto=require('node:crypto');
            const {owner,repo}=context.repo;
            const tag='v0.1.0-preview.10';
            const source='250785abbec59d3a188e5cd33212766a9dadc223';
            const release=(await github.rest.repos.getReleaseByTag({owner,repo,tag})).data;
            if(release.draft||!release.prerelease||release.target_commitish!==source)throw Error('Unexpected release identity');
            const assets=(await github.rest.repos.listReleaseAssets({owner,repo,release_id:release.id,per_page:100})).data;
            const names=['ChatGPT.Modder-0.1.0-preview.10-mac-arm64.dmg','ChatGPT.Modder-0.1.0-preview.10-win-x64.exe'];
            const hashes={};
            for(const name of names){
              const asset=assets.find(a=>a.name===name);
              if(!asset||asset.state!=='uploaded'||!/^sha256:[a-f0-9]{64}$/.test(asset.digest||''))throw Error('Missing verified binary: '+name);
              hashes[name]=asset.digest.slice(7);
            }
            const info=Buffer.from(JSON.stringify({version:'0.1.0-preview.10',tag,commit:source,workflowRun:'41055039474',metadataWorkflowRun:context.runId,prerelease:true,assets:hashes,macos:'arm64 DMG using preset background and layout',windows:'x64 portable; ordinary restart issue WIN-003 remains open'},null,2)+'\n');
            const sha=data=>crypto.createHash('sha256').update(data).digest('hex');
            const sums=Buffer.from([...names,'BUILD-INFO.json'].sort().map(n=>(n==='BUILD-INFO.json'?sha(info):hashes[n])+'  '+n+'\n').join(''));
            for(const [name,data] of [['BUILD-INFO.json',info],['SHA256SUMS.txt',sums]]){
              const old=assets.find(a=>a.name===name);
              if(old)await github.rest.repos.deleteReleaseAsset({owner,repo,asset_id:old.id});
              const uploaded=(await github.rest.repos.uploadReleaseAsset({owner,repo,release_id:release.id,name,data,headers:{'content-type':'application/octet-stream','content-length':data.length}})).data;
              if(uploaded.size!==data.length||uploaded.digest!=='sha256:'+sha(data))throw Error('Metadata verification failed: '+name);
            }
            const body=fs.readFileSync('docs/releases/v0.1.0-preview.10.md','utf8').replace(/\]\((\.\.?\/[^)]+)\)/g,(_,target)=>'](https://github.com/'+owner+'/'+repo+'/blob/'+context.sha+'/'+path.posix.normalize(path.posix.join('docs/releases',target))+')');
            await github.rest.repos.updateRelease({owner,repo,release_id:release.id,body});
            const final=(await github.rest.repos.listReleaseAssets({owner,repo,release_id:release.id,per_page:100})).data;
            if(final.length!==4)throw Error('Unexpected asset count');
            for(const name of names)if(final.find(a=>a.name===name)?.digest!=='sha256:'+hashes[name])throw Error('Binary changed unexpectedly');
            core.notice('Release binaries unchanged; checksum names verified against actual downloads');
